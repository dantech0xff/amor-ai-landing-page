name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: >-
          Trỏ E2E vào site đã deploy: "production" cho địa chỉ chính thức, hoặc
          một URL đầy đủ. Bỏ trống thì dựng bản production ngay trong runner.
        required: false
        default: ''

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm test
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}

      - name: Lưu báo cáo khi hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
